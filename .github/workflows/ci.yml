name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # toda segunda-feira, 8h (horário de Brasília): avisa se algo quebrar sem mudança no código
    - cron: "0 11 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
